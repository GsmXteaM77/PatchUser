name: Sync Latest.log

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Latest.log
        run: |
          set -e

          URL="https://raw.githubusercontent.com/Patch-U/Updates.jar/refs/heads/main/Latest.log"

          for i in 1 2 3 4 5; do
            echo "Attempt $i..."

            if curl -fL --retry 3 --connect-timeout 10 \
              "$URL" -o Latest.log; then
              echo "Download successful."
              break
            fi

            if [ "$i" -eq 5 ]; then
              echo "Failed after 5 attempts."
              exit 1
            fi

            sleep 10
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Latest.log

          if git diff --cached --quiet; then
            echo "Latest.log has not changed."
            exit 0
          fi

          git commit -m "chore: sync Latest.log"
          git push
