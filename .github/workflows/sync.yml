name: Sync Patch-U Files

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Patch-U files
        shell: bash
        run: |
          set -e

          download() {
            URL="$1"
            OUTPUT="$2"

            echo "Downloading $OUTPUT..."

            for attempt in 1 2 3 4 5; do
              if curl \
                --fail \
                --location \
                --silent \
                --show-error \
                --retry 3 \
                --connect-timeout 15 \
                "$URL" \
                --output "$OUTPUT"; then

                echo "Successfully downloaded $OUTPUT"
                return 0
              fi

              echo "Attempt $attempt failed."

              if [ "$attempt" -lt 5 ]; then
                sleep 10
              fi
            done

            echo "Failed to download $OUTPUT"
            return 1
          }

          download \
            "https://raw.githubusercontent.com/Patch-U/Updates.jar/refs/heads/main/Latest.log" \
            "Latest.log"

          download \
            "https://raw.githubusercontent.com/Patch-U/ApkPatchU.jar/refs/heads/main/ApkPatchU" \
            "ApkPatchU.py"

          download \
            "https://raw.githubusercontent.com/Patch-U/AntiApkPatchU.jar/refs/heads/main/AntiApkPatchU" \
            "AntiApkPatchU.py"

          download \
            "https://raw.githubusercontent.com/Patch-U/Patcher.jar/refs/heads/main/PatcherU" \
            "Patcher.py"

            - name: Commit changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Latest.log \
                  ApkPatchU.py \
                  AntiApkPatchU.py \
                  Patcher.py

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "chore: sync Patch-U files"

          # Get the latest changes from main
          git fetch origin main

          # Rebase our sync commit on top of the latest main
          git rebase origin/main

          # Push updated main
          git push origin HEAD:main
